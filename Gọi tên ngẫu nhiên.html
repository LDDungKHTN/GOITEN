<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gọi tên ngẫu nhiên</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--fg:#1d2433;--card:#fff;--mut:#667;--ac:#4f46e5;--bd:#d9deea;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12151f;--fg:#eceff7;--card:#1c2030;--mut:#9aa3b8;--ac:#818cf8;--bd:#333a52;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;padding:12px}
h1{font-size:1.3rem;margin:0 0 8px}.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
button,select,textarea{font:inherit;color:var(--fg)}
.chip{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.wrap{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.stage{flex:1 1 560px;max-width:900px;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
canvas{width:100%;display:block;aspect-ratio:900/520}
#res{display:none;text-align:center;font-size:clamp(1.6rem,6vw,2.8rem);font-weight:800;padding:12px;background:linear-gradient(90deg,#f59e0b,#ec4899);color:#fff;animation:pop .5s}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
aside{flex:1 1 220px;max-width:340px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
#go{width:100%;font-size:1.3rem;font-weight:700;padding:14px;border:0;border-radius:12px;background:var(--ac);color:#fff;cursor:pointer}
#go:disabled{opacity:.5}
.mut{color:var(--mut);font-size:.9rem}ol{padding-left:22px;max-height:240px;overflow:auto;margin:6px 0}
.sm{border:1px solid var(--bd);background:transparent;border-radius:8px;padding:5px 10px;cursor:pointer}
dialog{width:min(560px,94vw);background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:14px}
textarea{width:100%;height:50vh;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
</style></head><body>
<h1>🎲 Gọi tên ngẫu nhiên</h1>
<div class="row" id="cls"></div>
<div class="row" id="gm"></div>
<div class="wrap">
 <div class="stage"><div id="res"></div><canvas id="cv" width="900" height="520"></canvas></div>
 <aside>
  <button id="go">▶ GỌI TÊN</button>
  <label class="row"><input type="checkbox" id="nr" checked> Không gọi lại bạn đã gọi (đến khi hết lớp)</label>
  <label class="row"><input type="checkbox" id="vo"> 🔊 Đọc to tên</label>
  <div class="mut" id="cnt"></div>
  <b>Đã gọi:</b><ol id="hist"></ol>
  <div class="row"><button class="sm" id="rs">↺ Làm mới lượt</button><button class="sm" id="ed">✏️ Sửa lớp / tên</button></div>
 </aside>
</div>
<dialog id="dlg"><p class="mut">Dòng bắt đầu bằng <b>#</b> là tên lớp, các dòng sau là tên học sinh (mỗi dòng một bạn). Thêm lớp mới bằng dòng <b># Tên lớp</b>.</p>
<textarea id="ta"></textarea><div class="row"><button class="sm" id="sv">💾 Lưu</button><button class="sm" id="df">Khôi phục danh sách gốc</button><button class="sm" id="cx">Đóng</button></div></dialog>
<script>
const DEF={"7A4":["Huỳnh Vũ Hoàng Anh","Nguyễn Ngô Tường Anh","Trần Quốc Cường","Trần Phạm Ngọc Diễm","Phạm Hoàng Nhã Đan","Nguyễn Lê Quốc Đạt","Nguyễn Gia Hân","Nguyễn Huỳnh Nhã Hân","Nguyễn Huy Hoàng","Nguyễn Trần Gia Huy","Trương Võ Gia Huy","Trần Thị Mai Ka","Lê Gia Khải","Lê Trần Bảo Khang","Lê Ngân Khánh","Đỗ Anh Khoa","Nguyễn Tuấn Kiệt","Nguyễn Phi Long","Trần Cẩm Ly Ly","Trần Nguyễn Họa My","Trần Nguyễn Bảo Nam","Nguyễn Trung Nghĩa","Nguyễn Ánh Ngọc","Phan Võ Khôi Nguyên","Đoàn Đào Yến Nhi","Trần Tuyết Nhi","Phạm Hòa Phát","Trần Đại Phong","Võ Văn Phúc","Nguyễn Hữu Quốc","Lương Thị Ái Quyên","Huỳnh Tiểu Quỳnh","Lê Phương Thảo","Nguyễn Hoàng Thiên","Nguyễn Huỳnh Cẩm Tiên","Trương Kim Tiền","Đinh Kiều Trang","Trương Đỗ Yến Trang","Nguyễn Thị Ngọc Trâm","Phạm Nhã Trân","Lê Thiên Trí"],"7A8":["Huỳnh Thu An","Đinh Nhật Anh","Đỗ Tuấn Duy","Phạm Nguyễn Đức Duy","Phạm Nữ Kỳ Duyên","Đinh Thị Thúy Giang","Nguyễn Thị Ngọc Hân","Trương Văn Hậu","Nguyễn Huy Hoàng","Võ Thu Hương","Lỡ Hoàng Khiêm","Nguyễn Hoài Nam","Nguyễn Huỳnh Phương Ngân","Võ Thị Kim Ngân","Trần Thanh Nghĩa","Trần Khôi Nguyên","Nguyễn Phương Nhi","Nguyễn Thị Yến Nhi","Nguyễn Tuyết Nhi","Trần Nam Phi","Nguyễn Gia Phúc","Võ Thiên Thảo","Nguyễn Võ Cẩm Thư","Nguyễn Thị Kim Tiền","Nguyễn Võ Hoàng Tín","Phạm Nguyễn Quỳnh Trâm","Tiêu Thanh Tuyền","Nguyễn Nhật Tường","Mai Thanh Vinh","Thái Gia Vũ","Huỳnh Thái Thảo Vy","Đoàn Kim Yến"],"9A1":["Lương Thị Thúy An","Phạm Đình Tri Ân","Hồ Gia Bảo","Nguyễn Quỳnh Chi","Dương Quốc Cường","Nguyễn Thị Hương Giang","Trần Diệu Hân","Trần Thị Mỹ Hân","Lê Văn Hiệp","Nguyễn Quốc Hùng","Nguyễn Gia Huy","Nguyễn Gia Huy","Huỳnh Quốc Khánh","Trần Anh Khoa","Lý Tiểu Mỵ","Đào Ha Na","Trương Trọng Nam","Lương Nguyễn Thanh Ngân","Hồ Nguyễn Bảo Ngọc","Nguyễn Thị Kim Ngọc","Nguyễn Tuấn Nguyên","Nguyễn Trương Khải Nhật","Nguyễn Phạm Tấn Phát","Dương Ngọc Phú","Đặng Ngọc Diễm Quỳnh","Nguyễn Hùng Vương Thắng","Phạm Ngọc Thịnh","Phan Kim Thoa","Lê Minh Thư","Nguyễn Minh Thư","Trần Đỗ Minh Thư","Ngô Trần Hạ Thương","Nguyễn Thủy Tiên","Trần Hoàng Thủy Tiên","Nguyễn Đức Toàn","Nguyễn Ngọc Bảo Trang","Phạm Hoàng Huyền Trang","Nguyễn Thị Bảo Trâm","Ngô Võ Tuyết Trinh","Lương Nhật Vĩnh","Nguyễn Thế Vương","Nguyễn Ánh Vy","Võ Phạm Kiều Ý","Huỳnh Thị Mỹ Yến"]};
const $=s=>document.querySelector(s),W=900,H=520,TAU=6.2832,cv=$('#cv'),ctx=cv.getContext('2d');
let D=null,cls,pool,last=-1,hist=[],G,busy=false,FG='#000';
try{D=JSON.parse(localStorage.getItem('goiten_v1')||'null')}catch(e){}
if(!D||!Object.keys(D).length)D=DEF;
cls=Object.keys(D)[0];
const sh=(n,k)=>n.split(' ').slice(-k).join(' '),rnd=n=>Math.random()*n|0,all=()=>D[cls].map((_,i)=>i),nm=i=>D[cls][i];
function txt(s,x,y,size,maxW,col){ctx.font=`bold ${size}px sans-serif`;const w=ctx.measureText(s).width;if(w>maxW)ctx.font=`bold ${size*maxW/w}px sans-serif`;ctx.fillStyle=col||'#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}
const cand=()=>$('#nr').checked&&pool.length?pool:all().filter(i=>i!=last).concat(all().length==1?[0]:[]);
function reset(){pool=all();last=-1;hist=[];$('#res').style.display='none'}
function refresh(){G.setup(cand());const t=all().length;$('#cnt').textContent=$('#nr').checked?(pool.length?`Còn ${pool.length}/${t} bạn chưa được gọi`:'Đã gọi hết lớp – lượt sau bắt đầu vòng mới'):`Lớp có ${t} bạn (chỉ tránh trùng lượt trước)`;$('#hist').innerHTML=hist.map(h=>`<li>${h}</li>`).join('')}
function ui(){$('#cls').innerHTML=Object.keys(D).map(k=>`<button class="chip ${k==cls?'on':''}" data-c="${k}">Lớp ${k}</button>`).join('');
 $('#gm').innerHTML=Object.keys(games).map(k=>`<button class="chip ${games[k]==G?'on':''}" data-g="${k}">${games[k].n}</button>`).join('')}
document.addEventListener('click',e=>{const b=e.target.closest('[data-c],[data-g]');if(!b||busy)return;if(b.dataset.c){cls=b.dataset.c;reset()}else G=games[b.dataset.g];ui();refresh()});
$('#nr').onchange=refresh;
$('#rs').onclick=()=>{if(!busy){reset();refresh()}};
$('#go').onclick=()=>{if(busy||!D[cls].length)return;busy=true;$('#go').disabled=true;$('#res').style.display='none';
 const c=cand(),w=c[rnd(c.length)];last=w;if($('#nr').checked)pool=(pool.length?pool:all()).filter(i=>i!=w);
 G.start(c.indexOf(w),()=>{busy=false;$('#go').disabled=false;const n=nm(w);hist.unshift(n);const r=$('#res');r.style.display='block';r.style.animation='none';r.offsetWidth;r.style.animation='';r.textContent='🎉 '+n;
  if($('#vo').checked)try{const u=new SpeechSynthesisUtterance(n);u.lang='vi-VN';speechSynthesis.speak(u)}catch(e){}
  refresh()})};
$('#ed').onclick=()=>{$('#ta').value=Object.entries(D).map(([k,v])=>'# '+k+'\n'+v.join('\n')).join('\n\n');$('#dlg').showModal()};
$('#cx').onclick=()=>$('#dlg').close();
$('#df').onclick=()=>{$('#ta').value=Object.entries(DEF).map(([k,v])=>'# '+k+'\n'+v.join('\n')).join('\n\n')};
$('#sv').onclick=()=>{const o={};let c=null;for(const l of $('#ta').value.split('\n')){const s=l.trim();if(!s)continue;if(s[0]=='#'){c=s.slice(1).trim()||'Lớp';o[c]=o[c]||[]}else{if(!c){c='Lớp 1';o[c]=[]}o[c].push(s)}}
 if(!Object.keys(o).length)return alert('Cần ít nhất một lớp.');D=o;try{localStorage.setItem('goiten_v1',JSON.stringify(D))}catch(e){}
 if(!D[cls])cls=Object.keys(D)[0];reset();ui();refresh();$('#dlg').close()};

const games={
wheel:{n:'🎡 Vòng quay',r:0,f:null,setup(ids){this.ids=ids},
 start(wi,done){const seg=TAU/this.ids.length;let f=-1.5708-(wi+.5)*seg;f+=TAU*Math.ceil((this.r+25.2-f)/TAU);this.a=this.r;this.f=f;this.t0=null;this.done=done},
 draw(t){if(this.f!==null){if(this.t0===null)this.t0=t;const p=Math.min(1,(t-this.t0)/5500);this.r=this.a+(this.f-this.a)*(1-Math.pow(1-p,4));if(p>=1){this.f=null;this.r%=TAU;this.done()}}
  const n=this.ids.length,seg=TAU/n,cx=W/2,cy=H/2+10,R=235;
  this.ids.forEach((id,i)=>{const a=this.r+i*seg;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R,a,a+seg);ctx.fillStyle=`hsl(${i*47%360} 70% 52%)`;ctx.fill();ctx.strokeStyle='#fff6';ctx.stroke();
   ctx.save();ctx.translate(cx,cy);ctx.rotate(a+seg/2);txt(sh(nm(id),n>20?1:2),R/2+22,0,Math.min(20,R*seg*.6),R-60);ctx.restore()});
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,20,0,TAU);ctx.fill();
  ctx.fillStyle='#e11d48';ctx.beginPath();ctx.moveTo(cx-16,cy-R-16);ctx.lineTo(cx+16,cy-R-16);ctx.lineTo(cx,cy-R+18);ctx.fill()}},

balloon:{n:'🎈 Bắn bong bóng',gone:new Set(),
 setup(ids){this.ids=ids;this.ph=0;this.gone=new Set();this.ps=[];const n=ids.length,c=Math.ceil(Math.sqrt(n*1.7)),rw=Math.ceil(n/c),cw=W/c,ch=(H-90)/rw;this.r=Math.min(cw,ch/1.2)*.42;
  this.pos=ids.map((_,i)=>[(i%c+.5)*cw,(Math.floor(i/c)+.5)*ch+12]).sort(()=>Math.random()-.5)},
 bp(i,t){const p=this.pos[i];return[p[0]+Math.sin(t/700+i)*5,p[1]+Math.cos(t/900+i*2)*6]},
 start(wi,done){this.wi=wi;this.done=done;this.ph=1;this.t0=null;const n=this.ids.length;let tc=0;this.hops=[];for(let k=0;k<13;k++){tc+=100+k*k*3;this.hops.push([tc,k==12?wi:rnd(n)])}this.cur=0},
 draw(t){const r=this.r;
  this.pos.forEach((_,i)=>{if(this.gone.has(i))return;const[x,y]=this.bp(i,t);ctx.strokeStyle='#8887';ctx.beginPath();ctx.moveTo(x,y+r*1.2);ctx.quadraticCurveTo(x+7,y+r*1.2+12,x,y+r*1.2+24);ctx.stroke();
   ctx.fillStyle=`hsl(${i*53%360} 75% 58%)`;ctx.beginPath();ctx.ellipse(x,y,r,r*1.2,0,0,TAU);ctx.fill();txt(sh(nm(this.ids[i]),1),x,y,Math.min(18,r*.6),r*1.7)});
  ctx.fillStyle=FG;ctx.beginPath();ctx.moveTo(W/2-18,H);ctx.lineTo(W/2+18,H);ctx.lineTo(W/2,H-26);ctx.fill();
  if(this.ph&&this.t0===null)this.t0=t;const el=t-this.t0;
  if(this.ph==1){for(const h of this.hops)if(h[0]<=el)this.cur=h[1];if(el>this.hops[12][0]+500){this.ph=2;this.t1=t}}
  if(this.ph==1||this.ph==2){const[x,y]=this.bp(this.cur,t);ctx.strokeStyle='#e11d48';ctx.lineWidth=3;ctx.beginPath();ctx.arc(x,y,r*1.3,0,TAU);ctx.moveTo(x-r*1.7,y);ctx.lineTo(x+r*1.7,y);ctx.moveTo(x,y-r*1.7);ctx.lineTo(x,y+r*1.7);ctx.stroke();ctx.lineWidth=1}
  if(this.ph==2){const p=Math.min(1,(t-this.t1)/450),[x,y]=this.bp(this.wi,t),hx=W/2+(x-W/2)*p,hy=H-26+(y-H+26)*p;ctx.strokeStyle='#92400e';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W/2,H-26);ctx.lineTo(hx,hy);ctx.stroke();ctx.lineWidth=1;ctx.fillStyle='#92400e';ctx.beginPath();ctx.arc(hx,hy,6,0,TAU);ctx.fill();
   if(p>=1){this.ph=3;this.t2=t;this.gone.add(this.wi);for(let k=0;k<40;k++){const a=Math.random()*TAU,s=2+Math.random()*5;this.ps.push([x,y,Math.cos(a)*s,Math.sin(a)*s,k*37%360])}}}
  if(this.ph==3){this.ps.forEach(p=>{p[0]+=p[2];p[1]+=p[3];p[3]+=.2;ctx.fillStyle=`hsl(${p[4]} 80% 55%)`;ctx.fillRect(p[0],p[1],6,6)});if(t-this.t2>900){this.ph=0;this.done()}}}},

balls:{n:'⚽ Thả bóng vào lỗ',L:150,Rt:750,B:400,ph:0,
 setup(ids){this.ids=ids;this.ph=0;const n=ids.length;this.r=Math.min(27,Math.sqrt(600*380*.4/(n*3.14)));this.bs=ids.map(()=>({x:this.L+this.r+Math.random()*(600-2*this.r),y:30+Math.random()*300,vx:0,vy:0,out:0}))},
 start(wi,done){this.wi=wi;this.done=done;this.ph=1;this.fr=0},
 draw(t){const{L,Rt,B,r,bs}=this,hx=W/2,hw=r+6;this.fr++;
  if(this.ph==1&&this.fr>200){this.ph=2;this.fr=0}
  if(this.ph==2&&this.fr==600){const w=bs[this.wi];w.x=hx;w.y=B-r}
  bs.forEach((b,i)=>{const win=i==this.wi&&this.ph>=2;
   b.vy+=.35;if(this.ph==1){if(b.y>B-220)b.vy-=Math.random()*.95;b.vx+=(Math.random()-.5)*1.3}
   if(win&&!b.out)b.vx+=(hx-b.x)*.012;b.vx*=win?.94:.995;
   b.vx=Math.max(-12,Math.min(12,b.vx));b.vy=Math.max(-12,Math.min(12,b.vy));b.x+=b.vx;b.y+=b.vy;
   if(win&&!b.out&&Math.abs(b.x-hx)<5&&b.y>B-r-3)b.out=1;
   if(b.out){b.x+=(hx-b.x)*.3;if(b.y>H-r-8){b.y=H-r-8;b.vy*=-.35;if(this.ph==2){this.ph=3;this.fr=0}}}
   else{if(b.x<L+r){b.x=L+r;b.vx*=-.6}if(b.x>Rt-r){b.x=Rt-r;b.vx*=-.6}if(b.y<20+r){b.y=20+r;b.vy*=-.5}if(b.y>B-r){b.y=B-r;b.vy*=-.45}}});
  for(let i=0;i<bs.length;i++)for(let j=0;j<i;j++){const a=bs[i],c=bs[j];if(a.out||c.out)continue;let dx=a.x-c.x,dy=a.y-c.y,d=Math.hypot(dx,dy);if(d<2*r&&d>0){dx/=d;dy/=d;const o=(2*r-d)/2;a.x+=dx*o;a.y+=dy*o;c.x-=dx*o;c.y-=dy*o;const rel=(a.vx-c.vx)*dx+(a.vy-c.vy)*dy;if(rel<0){const m=-rel*.9;a.vx+=dx*m;a.vy+=dy*m;c.vx-=dx*m;c.vy-=dy*m}}}
  if(this.ph==3&&this.fr>45){this.ph=0;this.done();return}
  ctx.strokeStyle=FG;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(L,20);ctx.lineTo(L,B);if(this.ph>=2){ctx.lineTo(hx-hw,B);ctx.moveTo(hx+hw,B)}ctx.lineTo(Rt,B);ctx.lineTo(Rt,20);ctx.stroke();
  ctx.lineWidth=2;ctx.strokeRect(hx-hw-4,B+4,2*hw+8,H-B-8);ctx.lineWidth=1;
  txt('⬇ LỖ',hx+hw+50,B+24,18,80,FG);
  bs.forEach((b,i)=>{ctx.fillStyle=`hsl(${i*61%360} 70% 55%)`;ctx.beginPath();ctx.arc(b.x,b.y,r,0,TAU);ctx.fill();ctx.fillStyle='#fff4';ctx.beginPath();ctx.arc(b.x-r*.3,b.y-r*.3,r*.3,0,TAU);ctx.fill();txt(sh(nm(this.ids[i]),1),b.x,b.y,r*.65,r*1.75)})}},

slot:{n:'🎰 Quay số',ph:0,seq:[],
 setup(ids){this.ids=ids;this.ph=0;this.seq=[]},
 start(wi,done){const s=[];for(let i=0;i<45;i++)s.push(this.ids[rnd(this.ids.length)]);s.push(this.ids[wi]);for(let i=0;i<4;i++)s.push(this.ids[rnd(this.ids.length)]);this.seq=s;this.L=45;this.pos=0;this.t0=null;this.ph=1;this.done=done},
 draw(t){const cy=H/2;ctx.fillStyle='#f59e0b33';ctx.fillRect(60,cy-45,W-120,90);ctx.strokeStyle='#f59e0b';ctx.lineWidth=4;ctx.strokeRect(60,cy-45,W-120,90);ctx.lineWidth=1;
  if(this.ph){if(this.t0===null)this.t0=t;const p=Math.min(1,(t-this.t0)/5000);this.pos=this.L*(1-Math.pow(1-p,3));if(p>=1){this.ph=0;this.done()}}
  if(!this.seq.length)return txt('❓ Bấm GỌI TÊN',W/2,cy,44,W-160,FG);
  for(let k=Math.floor(this.pos)-3;k<=Math.floor(this.pos)+4;k++){if(k<0||k>=this.seq.length)continue;const d=Math.abs(k-this.pos);ctx.globalAlpha=Math.max(.1,1-d*.4);txt(nm(this.seq[k]),W/2,cy+(k-this.pos)*85,Math.max(18,46-d*10),W-160,d<.5?'#f59e0b':FG)}ctx.globalAlpha=1}}
};
G=games.wheel;
reset();ui();refresh();
(function loop(t){try{FG=getComputedStyle(document.documentElement).getPropertyValue('--fg')||'#000';ctx.clearRect(0,0,W,H);G.draw(t)}catch(e){console.error(e)}requestAnimationFrame(loop)})(0);
</script></body></html>
